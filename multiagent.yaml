# This Cloud Build file deploys 5 parallel AI agents to work on your codebase.
# Each agent uses an isolated git worktree and a carefully crafted prompt
# to securely analyze a specific subdirectory.

steps:
# --- Step 1: Configure Git for all subsequent steps ---
- id: 'ConfigureGit'
  name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    git config --global user.email "cloud-build-bot@google.com"
    git config --global user.name "Cloud Build Bot"
    echo "✅ Git configured globally."

- id: 'BugHunterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit']
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="BugHunterAgent-${BUILD_ID}"
    WORKTREE_PATH="/workspace/$${BRANCH_NAME}"

    git worktree add -b "$${BRANCH_NAME}" "$${WORKTREE_PATH}"
    cd "$${WORKTREE_PATH}"

    gemini --prompt "You are a senior engineering agent. Your task is to analyze the code within the '${_DIRECTORY}' directory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to the current directory and MUST NOT use '..' to access parent directories. \
      Within these constraints, find potential bugs like race conditions or null pointer exceptions. \
      If you find any, modify the code to fix them directly, updating unit tests as needed. Ensure tests pass. \
      Summarize your work in a new file named BugHunterAgent-changes.md." \
      --approval-mode=yolo
    
    if ! git diff --quiet; then
      git add .
      git commit -m "fix(ai): Automated bug fixes from BugHunterAgent in ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "BugHunterAgent found no issues to fix in ${_DIRECTORY}."
    fi

- id: 'DocWriterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit']
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="DocWriterAgent-${BUILD_ID}"
    WORKTREE_PATH="/workspace/$${BRANCH_NAME}"

    git worktree add -b "$${BRANCH_NAME}" "$${WORKTREE_PATH}"
    cd "$${WORKTREE_PATH}"

    gemini --prompt "You are a senior technical writer agent. Your task is to scan the '${_DIRECTORY}' directory for a README.md file. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to the current directory and MUST NOT use '..' to access parent directories. \
      Within these constraints, update the README to reflect the code in that directory, explaining its purpose and showing usage examples. \
      If the README is missing, create it." \
      --approval-mode=yolo
    
    if ! git diff --quiet; then
      git add .
      git commit -m "docs(ai): Automated documentation updates from DocWriterAgent in ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "DocWriterAgent found no documentation to update in ${_DIRECTORY}."
    fi

- id: 'TestWriterAgent'
  name: 'gcr.io/project/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit']
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="TestWriterAgent-${BUILD_ID}"
    WORKTREE_PATH="/workspace/$${BRANCH_NAME}"

    git worktree add -b "$${BRANCH_NAME}" "$${WORKTREE_PATH}"
    cd "$${WORKTREE_PATH}"

    gemini --prompt "You are a senior software engineer in test. Your goal is to increase test coverage for code in the '${_DIRECTORY}' directory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to the current directory and MUST NOT use '..' to access parent directories. \
      Within these constraints, identify missing unit tests, write them, and ensure they pass. Only keep tests that pass. \
      Summarize your work in a new file named TestWriterAgent-changes.md." \
      --approval-mode=yolo
    
    go test ./$_DIRECTORY/...
    
    if ! git diff --quiet; then
      git add .
      git commit -m "test(ai): Add new unit tests from TestWriterAgent for ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "TestWriterAgent did not add any new tests in ${_DIRECTORY}."
    fi

- id: 'CodeQualityAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit']
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="CodeQualityAgent-${BUILD_ID}"
    WORKTREE_PATH="/workspace/$${BRANCH_NAME}"

    git worktree add -b "$${BRANCH_NAME}" "$${WORKTREE_PATH}"
    cd "$${WORKTREE_PATH}"

    gemini --prompt "You are a senior Go engineering agent. Analyze the code in the '${_DIRECTORY}' directory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to the current directory and MUST NOT use '..' to access parent directories. \
      Within these constraints, apply these improvements: \
      1. **Refactor:** Improve code elegance and maintainability. \
      2. **Style:** Enforce the Google Go Style Guide. \
      3. **Modernize:** Update any deprecated packages or APIs, checking go.mod. \
      Summarize your work in a new file named CodeQualityAgent-changes.md." \
      --approval-mode=yolo
    
    if ! git diff --quiet; then
      git add .
      git commit -m "refactor(ai): Apply automated code quality improvements in ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "CodeQualityAgent found no improvements to make in ${_DIRECTORY}."
    fi

- id: 'SecurityAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit']
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="SecurityAgent-${BUILD_ID}"
    WORKTREE_PATH="/workspace/$${BRANCH_NAME}"

    git worktree add -b "$${BRANCH_NAME}" "$${WORKTREE_PATH}"
    cd "$${WORKTREE_PATH}"

    gemini --prompt "You are a senior security reviewer agent. Audit the code in the '${_DIRECTORY}' directory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to the current directory and MUST NOT use '..' to access parent directories. \
      Within these constraints, find and fix vulnerabilities like hardcoded secrets, SQL injection, or XSS. \
      Replace hardcoded credentials with a 'REPLACE_WITH_SECRET_MANAGER_KEY' placeholder. \
      Summarize your work in a new file named SecurityAgent-changes.md." \
      --approval-mode=yolo
    
    if ! git diff --quiet; then
      git add .
      git commit -m "security(ai): Automated security fixes from SecurityAgent in ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "SecurityAgent found no security issues in ${_DIRECTORY}."
    fi

# --- Configuration ---

# Use more CPU to make it faster
options:
  machineType: 'E2_HIGHCPU_32'

# Secrets to make available as environment variables for all steps.
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/$_SECRET_NAME_GEMINI/versions/latest
    env: 'GEMINI_API_KEY'
  - versionName: projects/$PROJECT_ID/secrets/$_SECRET_NAME_GITHUB/versions/latest
    env: 'GITHUB_PAT'

# User-defined substitutions to pass variables into the build.
substitutions:
  _SECRET_NAME_GEMINI: 'ed-gemini-argo-local-edrienne-key'
  _SECRET_NAME_GITHUB: 'ed-tekton-pipelines-token'
  _GITHUB_REPO_OWNER: 'codrienne'
  _GITHUB_REPO_NAME: 'tekton-pipelines'
  _DIRECTORY: 'pkg/apis/pipeline/v1' # The directory for the agents to focus on.
