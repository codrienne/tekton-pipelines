# This Cloud Build file deploys 5 parallel AI agents to work on your codebase.
# Each agent uses an isolated git worktree and a carefully crafted prompt
# to securely analyze a specific subdirectory.

steps:
# --- Step 1: Configure Git for all subsequent steps ---
- id: 'ConfigureGit'
  name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    git config --global user.email "cloud-build-bot@google.com"
    git config --global user.name "Cloud Build Bot"
    echo "✅ Git configured globally."

- id: 'BugHunterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit']
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    # Configure GitHub CLI
    echo "$$GITHUB_PAT" | gh auth login --with-token --hostname github.com
    gh config set git_protocol https

    # Agent-specific variables
    AGENT_NAME="BugHunterAgent"
    BRANCH_NAME="$${AGENT_NAME}-${BUILD_ID}"
    WORKTREE_PATH="/workspace/$${BRANCH_NAME}"
    SUMMARY_FILE="$${AGENT_NAME}-changes.md"
    COMMIT_MSG="fix(ai): Automated bug fixes from $${AGENT_NAME} in ${_DIRECTORY}"

    # Setup git worktree
    git worktree add -b "$${BRANCH_NAME}" "$${WORKTREE_PATH}"
    cd "$${WORKTREE_PATH}"

    # Run the AI agent
    gemini --prompt "You are an autonomous senior engineering agent. Your current working directory is '$${WORKTREE_PATH}'. Your task is to find and fix bugs in the '${_DIRECTORY}' subdirectory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to your current directory and MUST NOT use '..' to access parent directories. \
      You have full autonomy to read, analyze, and modify any files required to complete your task. Do not ask for permission or confirmation before reading or analyzing files, regardless of the quantity. \
      First, run the 'ls -R ${_DIRECTORY}' command to discover the files. Then, for each relevant file, analyze it for potential bugs like race conditions or null pointer exceptions. \
      If you find any, modify the code to fix them directly, updating unit tests as needed. Ensure tests pass. \
      Finally, summarize your work in a new file named $${SUMMARY_FILE}." \
      --model=${_MODEL} \
      --approval-mode=yolo

    # Check for changes and create a PR if needed
    if [[ -n "$(git status --porcelain)" ]]; then
      SUMMARY_BODY=$(cat "$${SUMMARY_FILE}")
      git add .
      git reset HEAD "$${SUMMARY_FILE}" # Unstage the summary file
      git commit -m "$${COMMIT_MSG}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"

      # Create the Pull Request
      gh pr create \
        --repo "${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}" \
        --base "ed-multiagent" \
        --head "$${BRANCH_NAME}" \
        --title "$${COMMIT_MSG}" \
        --body "$${SUMMARY_BODY}"
    else
      echo "$${AGENT_NAME} found no issues to fix in ${_DIRECTORY}."
    fi

- id: 'DocWriterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit']
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    # Configure GitHub CLI
    echo "$$GITHUB_PAT" | gh auth login --with-token --hostname github.com
    gh config set git_protocol https

    # Agent-specific variables
    AGENT_NAME="DocWriterAgent"
    BRANCH_NAME="$${AGENT_NAME}-${BUILD_ID}"
    WORKTREE_PATH="/workspace/$${BRANCH_NAME}"
    SUMMARY_FILE="$${AGENT_NAME}-changes.md"
    COMMIT_MSG="docs(ai): Automated documentation updates from $${AGENT_NAME} in ${_DIRECTORY}"

    # Setup git worktree
    git worktree add -b "$${BRANCH_NAME}" "$${WORKTREE_PATH}"
    cd "$${WORKTREE_PATH}"

    # Run the AI agent
    gemini --prompt "You are an autonomous senior technical writer agent. Your current working directory is '$${WORKTREE_PATH}'. Your task is to improve documentation in the '${_DIRECTORY}' subdirectory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to your current directory and MUST NOT use '..' to access parent directories. \
      You have full autonomy to proceed. Do not ask for permission before reading files. \
      First, run 'ls -R ${_DIRECTORY}' to discover the files. Then, find a README.md file. \
      If the README exists, update it to reflect the code in the directory, explaining its purpose and showing usage examples. If it is missing, create it. \
      Finally, summarize your work in a new file named $${SUMMARY_FILE}." \
      --model=${_MODEL} \
      --approval-mode=yolo

    # Check for changes and create a PR if needed
    if [[ -n "$(git status --porcelain)" ]]; then
      SUMMARY_BODY=$(cat "$${SUMMARY_FILE}")
      git add .
      git reset HEAD "$${SUMMARY_FILE}" # Unstage the summary file
      git commit -m "$${COMMIT_MSG}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"

      # Create the Pull Request
      gh pr create \
        --repo "${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}" \
        --base "ed-multiagent" \
        --head "$${BRANCH_NAME}" \
        --title "$${COMMIT_MSG}" \
        --body "$${SUMMARY_BODY}"
    else
      echo "$${AGENT_NAME} found no documentation to update in ${_DIRECTORY}."
    fi

