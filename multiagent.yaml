# This Cloud Build file deploys 5 parallel AI agents to work on your codebase.
# Each agent uses an isolated git worktree to check out a new branch,
# modify code, and push changes without interfering with other agents.

steps:
# --- Step 1: Configure Git for all subsequent steps ---
- id: 'ConfigureGit'
  name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    # Configure git for the entire build
    git config --global user.email "cloud-build-bot@google.com"
    git config --global user.name "Cloud Build Bot"
    echo "✅ Git configured globally."

- id: 'BugHunterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit'] # Run agents in parallel after git is configured
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="BugHunterAgent-${BUILD_ID}"

    # Create and move into the isolated worktree directory in one step
    git worktree add -b "$${BRANCH_NAME}" "/workspace/$${BRANCH_NAME}"
    cd "/workspace/$${BRANCH_NAME}"

    gemini --prompt "You are a senior engineering agent. Analyze the code within the '${_DIRECTORY}' directory \
      for potential bugs, including race conditions, null pointer exceptions, and logical flaws. \
      If you find any, modify the code to fix them directly. Make sure you adjust any unit tests as necessary, \
      and make sure those tests pass. Please summarize what you did in a file called BugHunterAgent-changes.md" \
      --approval-mode=yolo
    
    if ! git diff --quiet; then
      git add .
      git commit -m "fix(ai): Automated bug fixes from BugHunterAgent in ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "BugHunterAgent found no issues to fix in ${_DIRECTORY}."
    fi

- id: 'DocWriterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit'] # Run agents in parallel
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="DocWriterAgent-${BUILD_ID}"

    git worktree add -b "$${BRANCH_NAME}" "/workspace/$${BRANCH_NAME}"
    cd "/workspace/$${BRANCH_NAME}"

    gemini --prompt "You are a senior technical writer agent. Scan the '${_DIRECTORY}' directory for a README.md file. \
      Update it to fully reflect the code in that specific directory. Ensure it explains the code's purpose, \
      lists public functions or API endpoints, and provides clear usage examples. \
      If a README.md is missing in '${_DIRECTORY}', create one there." \
      --approval-mode=yolo
    
    if ! git diff --quiet; then
      git add .
      git commit -m "docs(ai): Automated documentation updates from DocWriterAgent in ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "DocWriterAgent found no documentation to update in ${_DIRECTORY}."
    fi

- id: 'TestWriterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit'] # Run agents in parallel
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="TestWriterAgent-${BUILD_ID}"

    git worktree add -b "$${BRANCH_NAME}" "/workspace/$${BRANCH_NAME}"
    cd "/workspace/$${BRANCH_NAME}"

    gemini --prompt "You are a senior software engineer in test. Your goal is to increase test coverage for the code \
      in the '${_DIRECTORY}' directory. Identify critical code paths missing unit tests within that directory, \
      write the necessary test files, and add them. After writing the tests, run them to ensure they pass \
      and correctly validate behavior. Only keep tests that pass. Summarize the changes in TestWriterAgent-changes.md" \
      --approval-mode=yolo
    
    # Use a single '$' for the Cloud Build substitution variable _DIRECTORY
    go test ./$_DIRECTORY/...
    
    if ! git diff --quiet; then
      git add .
      git commit -m "test(ai): Add new unit tests from TestWriterAgent for ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "TestWriterAgent did not add any new tests in ${_DIRECTORY}."
    fi

- id: 'CodeQualityAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit'] # Run agents in parallel
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="CodeQualityAgent-${BUILD_ID}"

    git worktree add -b "$${BRANCH_NAME}" "/workspace/$${BRANCH_NAME}"
    cd "/workspace/$${BRANCH_NAME}"

    gemini --prompt "You are a senior engineering agent specializing in Go code quality. Your task is to analyze the \
      code within the '${_DIRECTORY}' directory and apply three types of improvements: \
      1. **Refactor:** Identify and refactor long methods, complex logic, or tightly coupled components to improve code elegance and maintainability without changing external behavior. \
      2. **Style:** Enforce the best practices from the Google Go Style Guide (https://google.github.io/styleguide/go/best-practices.html). Correct any deviations in formatting, naming, error handling, and other style rules. \
      3. **Modernize:** Scan dependencies (e.g., go.mod) and source code for usage of deprecated packages or API calls. Replace them with modern alternatives, ensuring the code remains functional. \
      4. Summarize the changes in CodeQualityAgent-changes.md" \
      --approval-mode=yolo
    
    if ! git diff --quiet; then
      git add .
      git commit -m "refactor(ai): Apply automated code quality improvements in ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "CodeQualityAgent found no improvements to make in ${_DIRECTORY}."
    fi

- id: 'SecurityAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  waitFor: ['ConfigureGit'] # Run agents in parallel
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    BRANCH_NAME="SecurityAgent-${BUILD_ID}"

    git worktree add -b "$${BRANCH_NAME}" "/workspace/$${BRANCH_NAME}"
    cd "/workspace/$${BRANCH_NAME}"

    gemini --prompt "You are a senior security reviewer agent. Audit the code within the '${_DIRECTORY}' directory \
      for hardcoded API keys/secrets, Cloud Storage bucket squatting, SQL injection points, and XSS vulnerabilities. \
      If you find hardcoded credentials, replace them with a placeholder like 'REPLACE_WITH_SECRET_MANAGER_KEY' \
      and add a TODO. Patch other vulnerabilities directly. Summarize the changes in SecurityAgent-changes.md" \
      --approval-mode=yolo
    
    if ! git diff --quiet; then
      git add .
      git commit -m "security(ai): Automated security fixes from SecurityAgent in ${_DIRECTORY}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"
    else
      echo "SecurityAgent found no security issues in ${_DIRECTORY}."
    fi

# --- Configuration ---

# Use more CPU to make it faster
options:
  machineType: 'E2_HIGHCPU_32'

# Secrets to make available as environment variables for all steps.
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/$_SECRET_NAME_GEMINI/versions/latest
    env: 'GEMINI_API_KEY'
  - versionName: projects/$PROJECT_ID/secrets/$_SECRET_NAME_GITHUB/versions/latest
    env: 'GITHUB_PAT'

# User-defined substitutions to pass variables into the build.
substitutions:
  _SECRET_NAME_GEMINI: 'ed-gemini-argo-local-edrienne-key'
  _SECRET_NAME_GITHUB: 'ed-tekton-pipelines-token'
  _GITHUB_REPO_OWNER: 'codrienne'
  _GITHUB_REPO_NAME: 'tekton-pipelines'
  _DIRECTORY: 'pkg/apis/pipeline/v1' # The directory for the agents to focus on.
