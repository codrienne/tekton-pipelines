steps:
  # Step 1: A single Gemini step to analyze the commit and update relevant READMEs.
  - name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
    id: GeminiUpdateReadmes
    args:
      - '--approval-mode=yolo'
      - '--prompt'
      - >- # Using >- allows for a clean multi-line prompt
        You are an automated technical writer agent. Your task is to keep documentation synchronized with the latest code changes.
        1. First, identify all source code files that were modified in the most recent commit.
        2. For each modified file (ignoring changes to README.md files), find the corresponding README.md file located in the exact same directory.
        3. Analyze the code changes within the modified file (such as new functions, updated parameters, or bug fixes).
        4. Based on your analysis, intelligently update the corresponding README.md to accurately document these changes.
        5. If a README.md does not exist in the same directory as a modified file, you must take no action for that file.
    secretEnv: ['GEMINI_API_KEY']

  # Step 2: List the files in the workspace to verify the changes made by Gemini.
  - name: 'ubuntu'
    id: ListFiles
    entrypoint: 'ls'
    args: ['-laR'] # Using -laR to list files recursively for better visibility
    waitFor: ['GeminiUpdateReadmes']

  # Step 3: Commit the updated README files and push them to a new branch.
  - name: 'gcr.io/cloud-builders/git'
    id: 'Push to New Branch'
    secretEnv: ['GITHUB_PAT']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex

        # Configure Git with a bot identity for the commit
        git config --global user.email "cloud-build-bot@google.com"
        git config --global user.name "Cloud Build Bot"

        # Create a new branch with a unique name based on the build ID
        git checkout -b "${_BRANCH_NAME}-${SHORT_SHA}"
        echo "✅ Switched to new branch: ${_BRANCH_NAME}-${SHORT_SHA}"

        # Add all changes (the updated READMEs) and commit them
        # The '|| exit 0' part prevents the build from failing if there are no changes to commit
        git add . || exit 0
        git commit -m "docs: Automatically update READMEs based on code changes" || exit 0
        echo "🔒 Committed documentation updates."

        # Push the new branch to the GitHub repository using the PAT for authentication
        git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "${_BRANCH_NAME}-${SHORT_SHA}"
        echo "🚀 Pushed changes to origin/${_BRANCH_NAME}-${SHORT_SHA}"
    waitFor: ['ListFiles']

# Secrets to make available to the build steps
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/$_SECRET_NAME/versions/latest
    env: 'GEMINI_API_KEY'
  - versionName: projects/32289313582/secrets/ed-tekton-pipelines-token/versions/1
    env: 'GITHUB_PAT'

# Optional: List of images to push after the build
images:
  - 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'

# User-defined variables for the build
substitutions:
  _SECRET_NAME: 'Matt-gemini-api-key'
  _BRANCH_NAME: 'auto-doc-update' # Updated branch name for clarity
  _GITHUB_REPO_OWNER: 'codrienne'
  _GITHUB_REPO_NAME: 'tekton-pipelines'
