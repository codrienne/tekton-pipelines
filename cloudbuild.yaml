steps:
  # Step 1: Run the gemini command to modify files in the workspace.
  - name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
    id: GeminiModifyAndList
    args:
    - '--approval-mode=yolo'
    - '--prompt'
    - "Create a file that is called Matt-${BUILD_ID}, make it a txt file, and inside of it write Here is your random file!!!"
    - '--debug'
    secretEnv: ['GEMINI_API_KEY']

  - name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
    id: GeminiCreateCoolReadME
    args:
    - '--approval-mode=yolo'
    - '--prompt'
    - "look in specific folder path: pkg/apis/pipeline and analyze the code against https://google.github.io/styleguide/go/best-practices.html create a report about your findings and explain the practices that this code is NOT following please reply with written suggestions on good ways that we can improve this code "
    - '--debug'
    secretEnv: ['GEMINI_API_KEY']
    waitFor: ['-']

  # Step 2: List the files in the workspace to verify any changes.
  - name: 'ubuntu'
    id: ListFiles
    entrypoint: 'ls'
    args: ['-la']

  # Step 3: Commit and Push changes to a new branch using the PAT.
  - name: 'gcr.io/cloud-builders/git'
    id: 'Push to New Branch'
    # MODIFICATION: Make the PAT secret available to this step as an environment variable.
    secretEnv: ['GITHUB_PAT']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex

        # MODIFICATION: Configure Git with a bot identity. This is required for 'git commit'.
        # These values are just labels and do not need to be real or associated with a GitHub account.
        git config --global user.email "cloud-build-bot@google.com"
        git config --global user.name "Cloud Build Bot"

        git checkout -b "${_BRANCH_NAME}-${BUILD_ID}"
        echo "✅ Switched to new branch: ${_BRANCH_NAME}-${BUILD_ID}"

        # Add all file changes made by previous steps (like the Gemini step).
        # The '|| exit 0' part prevents the build from failing if there are no changes to commit.
        git add . || exit 0
        git commit -m "feat: Automated changes from Cloud Build" || exit 0
        echo "🔒 Committed changes."

        # MODIFICATION: Push to the new branch using the PAT for authentication.
        # The $$GITHUB_PAT syntax securely injects the secret value.
        git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "${_BRANCH_NAME}-${BUILD_ID}"
        echo "🚀 Pushed changes to origin/${_BRANCH_NAME}-${BUILD_ID}"

  # Step 4: Upload workspace to Google Cloud Storage (from your original file).
  - name: 'gcr.io/cloud-builders/gsutil'
    id: UploadToGCS
    args: ['cp', '-r', '/workspace', 'gs://$_BUCKET_NAME/$BUILD_ID']

# Secrets to make available as environment variables for all steps.
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/$_SECRET_NAME/versions/latest
    env: 'GEMINI_API_KEY'
  # MODIFICATION: Add your GitHub PAT secret.
  - versionName: projects/32289313582/secrets/ed-tekton-pipelines-token/versions/1
    env: 'GITHUB_PAT'

# Optional: List of images to push to a registry after the build.
images:
  - 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'

# User-defined substitutions to pass variables into the build.
substitutions:
  _SECRET_NAME: 'ed-gemini-api-key'
  _BUCKET_NAME: 'ed-gemini'
  _BRANCH_NAME: 'Matt'
  # MODIFICATION: Add substitutions for your PAT secret and repo details.
  # Replace these placeholder values when you run the build.
  _GITHUB_REPO_OWNER: 'codrienne'             # The owner of the repository.
  _GITHUB_REPO_NAME: 'tekton-pipelines'             # The name of the repository.
