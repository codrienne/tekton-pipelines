# This Cloud Build file deploys multiple AI agents to work on your codebase sequentially.
# Each agent checks out a fresh branch to analyze a specific subdirectory
# and proposes changes in a separate pull request.

steps:
# --- Step 1: Configure Git for all subsequent steps ---
- id: 'ConfigureGit'
  name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    git config --global user.email "cloud-build-bot@google.com"
    git config --global user.name "Cloud Build Bot"
    echo "✅ Git configured globally."

- id: 'BugHunterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    # Configure GitHub CLI
    echo "$$GITHUB_PAT" | gh auth login --with-token --hostname github.com
    gh config set git_protocol https

    # Agent-specific variables
    AGENT_NAME="BugHunterAgent"
    BRANCH_NAME="$${AGENT_NAME}-${SHORT_SHA}"
    SUMMARY_FILE="$${AGENT_NAME}-changes.md"
    COMMIT_MSG="fix(ai): Automated bug fixes from $${AGENT_NAME} in ${_DIRECTORY}"

    # Create a fresh branch from the original commit
    git checkout "$COMMIT_SHA"
    git checkout -b "$${BRANCH_NAME}"

    # Run the AI agent
    gemini --debug --prompt "You are an autonomous senior engineering agent. Your current working directory is '/workspace'. Your task is to find and fix bugs in the '${_DIRECTORY}' subdirectory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to your current directory and MUST NOT use '..' to access parent directories. \
      You have full autonomy. Formulate a plan and execute it immediately. Do not ask for permission, confirmation, or ask 'Should I proceed?'. \
      First, run the 'ls -R ${_DIRECTORY}' command to discover the files. Then, for each relevant file, analyze it for potential bugs like race conditions or null pointer exceptions. \
      If you find and fix any bugs, you must summarize your work in a new file named $${SUMMARY_FILE}}. If you make no changes, do not create this file." \
      --model=${_MODEL} \
      --approval-mode=yolo

    # Check for changes and create a PR if needed
    if [[ -n "$(git status --porcelain)" ]]; then
      SUMMARY_BODY="Automated changes by $${AGENT_NAME}."
      if [[ -f "$${SUMMARY_FILE}" ]]; then
          SUMMARY_BODY=$(cat "$${SUMMARY_FILE}")
      fi
      git add .
      git reset HEAD "$${SUMMARY_FILE}" # Unstage the summary file
      git commit -m "$${COMMIT_MSG}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"

      # Create the Pull Request
      gh pr create \
        --repo "${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}" \
        --base "ed-multiagent" \
        --head "$${BRANCH_NAME}" \
        --title "$${COMMIT_MSG}" \
        --body "$${SUMMARY_BODY}"
    else
      echo "$${AGENT_NAME} found no issues to fix in ${_DIRECTORY}."
    fi

- id: 'DocWriterAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    # Configure GitHub CLI
    echo "$$GITHUB_PAT" | gh auth login --with-token --hostname github.com
    gh config set git_protocol https

    # Agent-specific variables
    AGENT_NAME="DocWriterAgent"
    BRANCH_NAME="$${AGENT_NAME}-${SHORT_SHA}"
    SUMMARY_FILE="$${AGENT_NAME}-changes.md"
    COMMIT_MSG="docs(ai): Automated documentation updates from $${AGENT_NAME} in ${_DIRECTORY}"

    # Create a fresh branch from the original commit
    git checkout "$COMMIT_SHA"
    git checkout -b "$${BRANCH_NAME}"

    # Run the AI agent
    gemini --debug --prompt "You are an autonomous senior technical writer agent. Your current working directory is '/workspace'. Your task is to improve documentation in the '${_DIRECTORY}' subdirectory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to your current directory and MUST NOT use '..' to access parent directories. \
      You have full autonomy. Formulate a plan and execute it immediately. Do not ask for permission, confirmation, or ask 'Should I proceed?'. \
      First, run 'ls -R ${_DIRECTORY}' to discover the files. Then, find a README.md file. \
      If the README exists, update it to reflect the code in the directory, explaining its purpose and showing usage examples. If it is missing, create it. \
      If and only if you create or modify documentation, you must summarize your work in a new file named $${SUMMARY_FILE}}. If you make no changes, do not create this file." \
      --model=${_MODEL} \
      --approval-mode=yolo

    # Check for changes and create a PR if needed
    if [[ -n "$(git status --porcelain)" ]]; then
      SUMMARY_BODY="Automated changes by $${AGENT_NAME}."
      if [[ -f "$${SUMMARY_FILE}" ]]; then
          SUMMARY_BODY=$(cat "$${SUMMARY_FILE}")
      fi
      git add .
      git reset HEAD "$${SUMMARY_FILE}" # Unstage the summary file
      git commit -m "$${COMMIT_MSG}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"

      # Create the Pull Request
      gh pr create \
        --repo "${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}" \
        --base "ed-multiagent" \
        --head "$${BRANCH_NAME}" \
        --title "$${COMMIT_MSG}" \
        --body "$${SUMMARY_BODY}"
    else
      echo "$${AGENT_NAME} found no documentation to update in ${_DIRECTORY}."
    fi

- id: 'CodeQualityAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    # Configure GitHub CLI
    echo "$$GITHUB_PAT" | gh auth login --with-token --hostname github.com
    gh config set git_protocol https

    # Agent-specific variables
    AGENT_NAME="CodeQualityAgent"
    BRANCH_NAME="$${AGENT_NAME}-${SHORT_SHA}"
    SUMMARY_FILE="$${AGENT_NAME}-changes.md"
    COMMIT_MSG="refactor(ai): Apply automated code quality improvements in ${_DIRECTORY}"

    # Create a fresh branch from the original commit
    git checkout "$COMMIT_SHA"
    git checkout -b "$${BRANCH_NAME}"

    # Run the AI agent
    gemini --debug --prompt "You are an autonomous senior Go engineering agent. Your current working directory is '/workspace'. Your task is to improve code quality in the '${_DIRECTORY}' subdirectory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to your current directory and MUST NOT use '..' to access parent directories. \
      You have full autonomy. Formulate a plan and execute it immediately. Do not ask for permission, confirmation, or ask 'Should I proceed?'. \
      First, run 'ls -R ${_DIRECTORY}' to see the files. Then, apply these improvements to the code: \
      1. **Refactor:** Improve code elegance and maintainability. \
      2. **Style:** Enforce the Google Go Style Guide. \
      3. **Modernize:** Update any deprecated packages or APIs, checking go.mod. \
      If and only if you apply improvements to the code, you must summarize your work in a new file named $${SUMMARY_FILE}}. If you make no changes, do not create this file." \
      --model=${_MODEL} \
      --approval-mode=yolo

    # Check for changes and create a PR if needed
    if [[ -n "$(git status --porcelain)" ]]; then
      SUMMARY_BODY="Automated changes by $${AGENT_NAME}."
      if [[ -f "$${SUMMARY_FILE}" ]]; then
          SUMMARY_BODY=$(cat "$${SUMMARY_FILE}")
      fi
      git add .
      git reset HEAD "$${SUMMARY_FILE}" # Unstage the summary file
      git commit -m "$${COMMIT_MSG}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"

      # Create the Pull Request
      gh pr create \
        --repo "${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}" \
        --base "ed-multiagent" \
        --head "$${BRANCH_NAME}" \
        --title "$${COMMIT_MSG}" \
        --body "$${SUMMARY_BODY}"
    else
      echo "$${AGENT_NAME} found no improvements to make in ${_DIRECTORY}."
    fi

- id: 'SecurityAgent'
  name: 'gcr.io/$PROJECT_ID/gemini-cli-node20:latest'
  secretEnv: ['GEMINI_API_KEY', 'GITHUB_PAT']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -ex
    # Configure GitHub CLI
    echo "$$GITHUB_PAT" | gh auth login --with-token --hostname github.com
    gh config set git_protocol https

    # Agent-specific variables
    AGENT_NAME="SecurityAgent"
    BRANCH_NAME="$${AGENT_NAME}-${SHORT_SHA}"
    SUMMARY_FILE="$${AGENT_NAME}-changes.md"
    COMMIT_MSG="security(ai): Automated security fixes from $${AGENT_NAME} in ${_DIRECTORY}"

    # Create a fresh branch from the original commit
    git checkout "$COMMIT_SHA"
    git checkout -b "$${BRANCH_NAME}"

    # Run the AI agent
    gemini --debug --prompt "You are an autonomous senior security reviewer agent. Your current working directory is '/workspace'. Your task is to audit code in the '${_DIRECTORY}' subdirectory. \
      IMPORTANT: You are in a sandboxed environment. All file paths you access must be relative to your current directory and MUST NOT use '..' to access parent directories. \
      You have full autonomy. Formulate a plan and execute it immediately. Do not ask for permission, confirmation, or ask 'Should I proceed?'. \
      First, run 'ls -R ${_DIRECTORY}' to see the files. Then, find and fix vulnerabilities like hardcoded secrets, SQL injection, or XSS. \
      Replace hardcoded credentials with a 'REPLACE_WITH_SECRET_MANAGER_KEY' placeholder. \
      If and only if you find and fix vulnerabilities, you must summarize your work in a new file named $${SUMMARY_FILE}}. If you make no changes, do not create this file." \
      --model=${_MODEL} \
      --approval-mode=yolo

    # Check for changes and create a PR if needed
    if [[ -n "$(git status --porcelain)" ]]; then
      SUMMARY_BODY="Automated changes by $${AGENT_NAME}."
      if [[ -f "$${SUMMARY_FILE}" ]]; then
          SUMMARY_BODY=$(cat "$${SUMMARY_FILE}")
      fi
      git add .
      git reset HEAD "$${SUMMARY_FILE}" # Unstage the summary file
      git commit -m "$${COMMIT_MSG}"
      git push https://$$GITHUB_PAT@github.com/${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}.git "$${BRANCH_NAME}"

      # Create the Pull Request
      gh pr create \
        --repo "${_GITHUB_REPO_OWNER}/${_GITHUB_REPO_NAME}" \
        --base "ed-multiagent" \
        --head "$${BRANCH_NAME}" \
        --title "$${COMMIT_MSG}" \
        --body "$${SUMMARY_BODY}"
    else
      echo "$${AGENT_NAME} found no security issues in ${_DIRECTORY}."
    fi

# --- Configuration ---

options:
  diskSizeGb: '300'
  machineType: 'E2_HIGHCPU_32'

# Secrets to make available as environment variables for all steps.
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/$_SECRET_NAME_GEMINI/versions/latest
    env: 'GEMINI_API_KEY'
  - versionName: projects/$PROJECT_ID/secrets/$_SECRET_NAME_GITHUB/versions/latest
    env: 'GITHUB_PAT'

# User-defined substitutions to pass variables into the build.
substitutions:
  _MODEL: 'gemini-2.5-pro' # 'gemini-1.5-flash-latest'
  _SECRET_NAME_GEMINI: 'ed-gemini-argo-local-edrienne-key'
  _SECRET_NAME_GITHUB: 'ed-tekton-pipelines-token'
  _GITHUB_REPO_OWNER: 'codrienne'
  _GITHUB_REPO_NAME: 'tekton-pipelines'
  _DIRECTORY: 'pkg/apis/pipeline/v1beta1' # The directory for the agents to focus on.
